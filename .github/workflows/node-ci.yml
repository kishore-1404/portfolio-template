name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Syntax & Server Smoke Test
      run: |
        node --check server.js
        node server.js &
        SERVER_PID=$!
        sleep 2
        curl -sI http://localhost:3000/ | grep "HTTP/1.1 200 OK"
        curl -s http://localhost:3000/data/main.json | grep "spideyPins"
        kill $SERVER_PID
